name: Battlefield browser graphics
on:
  # Conserve the free monthly allowance of this private repository.
  # Full suites remain manual and run once weekly, never on every code commit.
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 0'
permissions:
  contents: read
concurrency:
  group: battlefield-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Chromium battlefield art and responsive multiplayer room
        run: node scripts/run-checks.mjs --browser
      - name: Save rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlefield-art
          path: artifacts/battlefield-art/
          if-no-files-found: ignore
