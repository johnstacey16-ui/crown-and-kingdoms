name: Last Crown one-off scripted acceptance
on:
  push:
    branches: [fix/last-crown-king-objective-20261103]
permissions:
  contents: read
jobs:
  last-crown:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate The Last Crown victory with actual production AI and King rules
        run: CK_MISSION=5 node tests/simulation-smoke.test.mjs
