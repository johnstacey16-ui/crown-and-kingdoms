name: Live Supabase guest smoke
# This intentionally creates two anonymous Auth records in the existing project.
# Run only when this dedicated probe changes, or through manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-supabase-relay.mjs'
      - '.github/workflows/supabase-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-supabase-smoke
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual guest Auth and relay (two guest records)
        env:
          CK_RUN_SUPABASE_SMOKE: '1'
        run: node scripts/verify-supabase-relay.mjs > live-supabase-smoke.log 2>&1
      - name: Show non-secret smoke results
        if: always()
        run: cat live-supabase-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-supabase-smoke
          path: live-supabase-smoke.log
          retention-days: 7
