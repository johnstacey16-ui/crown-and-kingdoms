name: Game regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-game.mjs
      - run: node tests/trade-routes.test.mjs
      - run: node tests/fishing-economy.test.mjs
      - run: node tests/fish-traps.test.mjs
      - run: node tests/technology-effects.test.mjs
      - run: node tests/ai-retreat.test.mjs
      - run: node tests/campaign-content.test.mjs
      - run: node tests/map-connectivity.test.mjs
      - run: node tests/map-generation-static.test.mjs
      - run: node tests/validate-atlas.mjs
