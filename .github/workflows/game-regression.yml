name: Game regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-playthroughs:
    name: Campaign mission suite (19 missions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all isolated campaign playthroughs
        shell: bash
        run: |
          set -euo pipefail
          for mission in {0..18}; do
            echo "::group::Campaign mission ${mission}"
            CK_MISSION="${mission}" node tests/simulation-smoke.test.mjs
            echo "::endgroup::"
          done
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse game scripts and run source invariants
        run: node scripts/check-game.mjs
      - name: Run every standalone regression test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No regression tests found in tests/"
            exit 1
          fi
          # Report every failure, not only the first test in alphabetical order.
          passed=0
          failed=0
          failures=()
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            if CK_SKIP_CAMPAIGN=1 node "${test_file}"; then
              ((passed+=1))
            else
              ((failed+=1))
              failures+=("${test_file}")
            fi
            echo "::endgroup::"
          done
          {
            echo "## Standalone regression tests"
            echo "Passed: ${passed} / ${#tests[@]}"
            echo "Failed: ${failed}"
            if (( failed > 0 )); then
              echo ""
              echo "### Failed test files"
              for test_file in "${failures[@]}"; do
                echo "- \`${test_file}\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failed > 0 )); then
            echo "::error::${failed} of ${#tests[@]} standalone regression files failed; see job summary and grouped output."
            exit 1
          fi
      - name: Validate local sprite atlas metadata and frame bounds
        run: node tests/validate-atlas.mjs
