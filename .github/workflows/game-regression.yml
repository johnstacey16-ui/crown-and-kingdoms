name: Game regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-playthroughs:
    name: Campaign mission suite (19 missions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all isolated campaign playthroughs
        shell: bash
        run: |
          set -euo pipefail
          for mission in {0..18}; do
            echo "::group::Campaign mission ${mission}"
            CK_MISSION="${mission}" node tests/simulation-smoke.test.mjs
            echo "::endgroup::"
          done
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse game scripts and run source invariants
        run: node scripts/check-game.mjs
      - name: Run every standalone regression test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No regression tests found in tests/"
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            CK_SKIP_CAMPAIGN=1 node "${test_file}"
            echo "::endgroup::"
          done
      - name: Validate local sprite atlas metadata and frame bounds
        run: node tests/validate-atlas.mjs
