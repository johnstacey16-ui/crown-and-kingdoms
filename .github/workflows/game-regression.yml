name: Game regression checks
on:
  # The expensive full suites are weekly or manually requested; never on every push.
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign-playthroughs:
    name: Campaign mission suite (19 isolated missions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all isolated campaign playthroughs
        run: node scripts/run-checks.mjs --campaigns
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every standalone regression test
        run: node scripts/run-checks.mjs --regression-files
  seeded-skirmishes:
    name: Seeded AI skirmishes (3 production simulations)
    runs-on: ubuntu-latest
    # Prevent a long-running AI simulation consuming unlimited free runner minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete seeded land skirmishes with production AI
        run: node scripts/run-checks.mjs --skirmishes
