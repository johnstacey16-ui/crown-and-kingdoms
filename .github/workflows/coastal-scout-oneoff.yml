name: One-off coastal scouting acceptance
on:
  push:
    branches:
      - fix/coastal-campaign-scouting-bot-20261103
permissions:
  contents: read
concurrency:
  group: coastal-scout-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Golden Coast (mission 13)
        run: CK_MISSION=12 node tests/simulation-smoke.test.mjs
      - name: Causeway Muster (mission 17)
        run: CK_MISSION=16 node tests/simulation-smoke.test.mjs
