name: One-off production AI skirmish acceptance
on:
  push:
    branches: [feat/ai-imperial-three-centre-economy-20261103]
permissions:
  contents: read
jobs:
  seeded-skirmish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seeded production AI victory simulation
        run: node scripts/run-skirmish.mjs
