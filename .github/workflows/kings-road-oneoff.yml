name: One-off full 19-mission campaign acceptance
on:
  push:
    branches: [fix/kings-road-stone-objective-20261103]
permissions:
  contents: read
jobs:
  kings-road:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate all 19 isolated campaigns with real orders
        run: node scripts/run-checks.mjs --campaigns
