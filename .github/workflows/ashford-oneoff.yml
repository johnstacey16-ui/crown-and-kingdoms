name: Ashford one-off siege diagnostic
on:
  push:
    branches: [fix/ashford-siege-winnability-20261103]
permissions:
  contents: read
jobs:
  ashford:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate Crown of Ashford in the production engine
        run: CK_MISSION=8 node tests/simulation-smoke.test.mjs
