name: WebRTC browser transport
on:
  push:
    branches: [main]
    paths:
      - 'js/network-webrtc.js'
      - 'js/network-supabase.js'
      - 'js/network-transport.js'
      - 'tests/browser/webrtc-transport.mjs'
      - '.github/workflows/webrtc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/webrtc-transport.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webrtc-transport
          path: artifacts/webrtc/
          if-no-files-found: ignore
