name: One-off full 19-mission acceptance
on:
  push:
    branches: [fix/iron-pass-supply-camp-20261103]
permissions:
  contents: read
jobs:
  iron-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rerun all 19 scripted campaigns on the corrected engine
        run: node scripts/run-checks.mjs --campaigns
