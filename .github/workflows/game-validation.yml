name: Game validation

on:
  push:
    branches: [main, development]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Covers explicit one-off 19-mission verification; normal pushes remain quick.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Both selections are owned by scripts/run-checks.mjs, not duplicated here.
      # Full standalone, AI, campaign and Chromium suites remain weekly/manual.
      - name: Validate source, offline graph, civilizations, atlas and graphics
        run: node scripts/run-checks.mjs --quick
      - name: Check focused gameplay, controller and graphics regression contracts
        run: node scripts/run-checks.mjs --focused
      # A commit explicitly marked [verify-causeway] opts into one bounded
      # real mission simulation; the default per-push gate stays inexpensive.
      - name: Diagnose Causeway end-to-end (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-causeway]')
        env:
          CK_MISSION: '16'
        run: node tests/simulation-smoke.test.mjs
      - name: Diagnose Crown Crossing end-to-end (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-crossing]')
        env:
          CK_MISSION: '17'
        run: node tests/simulation-smoke.test.mjs
      # Intentionally expensive, one-off gate. Every mission runs in its own
      # process, preserving the weekly/manual default for full regressions.
      - name: Verify all nineteen complete scripted campaign playthroughs (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-campaign-matrix]')
        run: node scripts/run-checks.mjs --campaigns
      - name: Diagnose Golden Coast end-to-end (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-golden-coast]')
        env:
          CK_MISSION: '12'
        run: node tests/simulation-smoke.test.mjs
      # One-off real 30Hz convoy playthrough; ordinary commits never run it.
      - name: Verify Redwater escort delivery (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-redwater]')
        env:
          CK_MISSION: '7'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      # One-off 30Hz real economic mission run, not included in ordinary pushes.
      - name: Verify King's Road paid-supply defence (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-kings-road]')
        env:
          CK_MISSION: '10'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify first Relic Road authored shrines and Turkish pursuit (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-relic-road]')
        env:
          CK_MISSION: '3'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Reliquary Trail escorted relic recovery (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-reliquary]')
        env:
          CK_MISSION: '11'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Ashford Castle breach and true capital victory (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-ashford]')
        env:
          CK_MISSION: '8'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Northern Watch forward beacon and ten-minute defence (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-northern]')
        env:
          CK_MISSION: '6'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Raiders at the Ford crossing and forward guard (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-raiders-ford]')
        env:
          CK_MISSION: '1'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Kronburg flank sabotage and Castle reserve (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-kronburg]')
        env:
          CK_MISSION: '4'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Greywatch fortified siege and reactive garrison (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-greywatch]')
        env:
          CK_MISSION: '9'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Iron Pass royal supply wagon escort (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-iron-pass]')
        env:
          CK_MISSION: '18'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Blackwood bridgehead and genuine eight-minute defence (explicit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-blackwood]')
        env:
          CK_MISSION: '15'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
      - name: Verify Feudal Frontier staged raids (explicit commit opt-in only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-frontier]')
        env:
          CK_MISSION: '2'
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs

  # Explicit per-commit acceptance gates. They never run on routine pushes,
  # PRs or schedules; the weekly/manual game-regression workflow is unchanged.
  full-standalone-regressions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[verify-regression-files]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every current standalone test in its own Node process
        run: node scripts/run-checks.mjs --regression-files

  seeded-ai-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[verify-seeded-skirmishes]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run three deterministic production-AI skirmish scenarios
        run: node scripts/run-checks.mjs --skirmishes

  # Focused diagnostics for the four formerly unverified standalone files.
  # This separate one-off job preserves the cheap ordinary push path.
  regression-recheck:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[verify-regression-recheck]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Bengali, Gurjara, and HTTP multiplayer regressions
        run: |
          node tests/civilization-bengali-ratha.test.mjs
          node tests/civilization-gurjara-camel.test.mjs
          node tests/network-battlefield-live.test.mjs
      - name: Audit all nineteen campaign goal predicates without scripted playthroughs
        env:
          CK_SKIP_CAMPAIGN: '1'
        run: node tests/simulation-smoke.test.mjs

  # This is an explicit, single-revision UI visual review, not a normal push gate.
  # Leave the comprehensive battlefield-art workflow weekly/manual.
  hud-browser:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-hud-browser]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Chromium tooling for the opted-in UI check
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture real Canvas2D HUD and command menus at four sizes
        run: node tests/browser/hud-layout.mjs
      - name: Capture HUD and command wheels over real terrain and a large battle
        run: node tests/browser/hud-battlefield.mjs
      - name: Store UI visual-acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-kingdoms-hud-ui
          path: |
            artifacts/battlefield-art/figma-live-*
            artifacts/battlefield-art/figma-world-*
          if-no-files-found: ignore

  # Deliberate one-off release acceptance, never included in routine pushes.
  # Chromium and Xbox software contracts are distinct from actual Series S FPS.
  release-browser-xbox:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[verify-browser-xbox]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Chromium tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete battlefield and multiplayer-room browser checks
        run: node scripts/run-checks.mjs --browser
      - name: Verify Xbox controller and performance software contracts
        run: node scripts/run-checks.mjs --xbox-contracts

  # Opt-in parallel isolation of the six failing missions. Do not relax the
  # natural victory gate or infer matrix acceptance from this subset.
  repair-campaign-matrix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && contains(github.event.head_commit.message, '[verify-campaign-repairs]')
    strategy:
      fail-fast: false
      matrix:
        mission: [8, 9, 10, 11, 14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Natural victory on campaign mission index ${{ matrix.mission }}
        env:
          CK_MISSION: ${{ matrix.mission }}
          CK_REQUIRE_CAMPAIGN_VICTORY: '1'
        run: node tests/simulation-smoke.test.mjs
