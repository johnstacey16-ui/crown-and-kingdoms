name: Game validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game source
        run: node scripts/check-game.mjs
      # Run focused source/behavior contracts on every push; leave the expensive
      # full standalone, seeded AI, campaign and Chromium suites weekly or manual.
      - name: Check focused gameplay, controller and graphics regression contracts
        run: |
          node --test \
            tests/simulation-victory-ownership.test.mjs \
            tests/simulation-logistics-ownership.test.mjs \
            tests/score-time-limit.test.mjs \
            tests/sudden-death.test.mjs \
            tests/king-of-the-hill.test.mjs \
            tests/diplomacy.test.mjs \
            tests/browser-foundation.test.mjs \
            tests/tribute.test.mjs \
            tests/map-layouts.test.mjs \
            tests/map-layout-content.test.mjs \
            tests/guard-follow.test.mjs \
            tests/villager-priority.test.mjs \
            tests/population-limit-controls.test.mjs \
            tests/no-attack-stance.test.mjs \
            tests/fish-traps.test.mjs \
            tests/engine-graphics-benchmark-ownership.test.mjs \
            tests/series-s-auto-pixel-benchmark.test.mjs \
            tests/series-s-auto-layer-benchmark.test.mjs \
            tests/series-s-benchmark-controller-isolation.test.mjs \
            tests/series-s-sharp-hud-canvas.test.mjs \
            tests/series-s-xbox-picture-presets.test.mjs \
            tests/ai-policy-ownership.test.mjs \
            tests/ai-module-ownership.test.mjs \
            tests/ai-defence-priority.test.mjs \
            tests/ai-siege-target-runtime.test.mjs \
            tests/ai-siege-support.test.mjs \
            tests/ai-queued-unit-limits.test.mjs \
            tests/ai-economy-difficulty.test.mjs \
            tests/ai-rebuild-destroyed-buildings.test.mjs
      # Full standalone tests and isolated mission playthroughs belong to game-regression.yml.
      # Keep this independent lightweight check useful even while game tests fail.
      - name: Validate browser/offline runtime file graph
        run: node scripts/audit-runtime-graph.mjs
      - name: Validate versioned civilization catalogue
        run: node scripts/check-civilization-catalogue.mjs
      - name: Validate sprite atlas
        run: node tests/validate-atlas.mjs

      - name: Validate whole-game graphics inventory
        run: node scripts/audit-graphics.mjs --check
