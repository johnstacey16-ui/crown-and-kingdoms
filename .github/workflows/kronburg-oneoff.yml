name: One-off full 19-mission campaign acceptance
on:
  push:
    branches: [fix/kronburg-siege-acceptance-20261103]
permissions:
  contents: read
jobs:
  kronburg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all 19 scripted campaign simulations
        run: node scripts/run-checks.mjs --campaigns
