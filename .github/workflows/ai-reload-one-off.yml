name: One-off active AI save/reload verification
on:
  push:
    branches:
      - verify/active-ai-reload-2026-11-02
    paths:
      - .github/workflows/ai-reload-one-off.yml
permissions:
  contents: read
jobs:
  ai-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run three seeded production AI matches (including 900s reload)
        run: node scripts/run-checks.mjs --skirmishes
